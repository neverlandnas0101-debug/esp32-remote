<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEAM 藍牙遙控車</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body { 
            text-align: center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0;
            padding: 10px;
        }
        h2 { color: #333; margin: 10px 0; font-size: 20px; }
        
        .bt-card {
            background: white;
            max-width: 480px;
            margin: 5px auto 15px auto;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #connectBtn { 
            font-size: 17px; 
            padding: 10px 24px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,123,255,0.25);
        }
        #connectBtn:active { background-color: #0056b3; }

        #status { font-size: 13px; color: #d9534f; font-weight: bold; }

        /* 雙手遙控器面板：直式手機固定左右並列 */
        #controls { 
            display: none; 
            margin-top: 15px; 
            width: 100%;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
        .joystick-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 10px;
        }

        .stick-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .stick-row {
            display: flex;
            gap: 10px;
        }

        .group-title {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 2px;
        }

        /* 專門對應直式螢幕的大按鈕 (寬高 72~80px) */
        .d-btn {
            font-size: 32px;
            background-color: #ffffff;
            border: 2px solid #b8c2cc;
            border-radius: 18px;
            cursor: pointer;
            width: 78px;
            height: 78px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.08s ease, background-color 0.08s ease;
        }
        .d-btn:active {
            background-color: #d1e7dd;
            border-color: #198754;
            transform: scale(0.93);
        }

        /* 急停按鈕：橫向長條，醒目安全 */
        .btn-stop {
            background-color: #ff4d4d;
            border: 2px solid #d93838;
            color: white;
            font-size: 18px;
            font-weight: bold;
            width: 166px;
            height: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(255,77,77,0.25);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.08s ease;
        }
        .btn-stop:active { 
            background-color: #cc0000; 
            transform: scale(0.95); 
        }
    </style>
</head>
<body>
    <h2>🚗 STEAM 智慧遙控車</h2>

    <div class="bt-card">
        <button id="connectBtn" onclick="connect()">📶 搜尋並開啟藍牙連線</button>
        <div id="status">狀態：尚未與車子建立藍牙連線</div>
    </div>

    <div id="controls">
        <div class="joystick-container">
            <!-- 左手區域：前後移動 -->
            <div class="stick-group">
                <span class="group-title">【 前後 】</span>
                <button class="d-btn" onclick="sendCmd('F')">⬆️</button>
                <button class="d-btn" onclick="sendCmd('B')">⬇️</button>
            </div>

            <!-- 右手區域：轉向與急停 -->
            <div class="stick-group">
                <span class="group-title">【 轉向 / 停止 】</span>
                <button class="btn-stop" onclick="sendCmd('S')">🛑 停止</button>
                <div class="stick-row">
                    <button class="d-btn" onclick="sendCmd('L')">⬅️</button>
                    <button class="d-btn" onclick="sendCmd('R')">➡️</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let bleCharacteristic;

        async function connect() {
            try {
                if (!navigator.bluetooth) {
                    alert('您的瀏覽器不支援 Web Bluetooth，請使用 Bluefy App 操作！');
                    return;
                }

                const statusEl = document.getElementById('status');
                statusEl.style.color = '#f0ad4e';
                statusEl.innerText = '狀態：正在掃描附近的藍牙車...';
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });

                statusEl.innerText = '狀態：正在建立藍牙通道 (GATT)...';
                const server = await device.gatt.connect();
                
                statusEl.innerText = '狀態：正在配置序列埠服務...';
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                bleCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                
                // 連線成功切換狀態
                statusEl.style.color = '#198754';
                statusEl.innerText = '狀態：🟢 藍牙已連線，可以開始遙控！';
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
            } catch (error) {
                console.log(error);
                const statusEl = document.getElementById('status');
                statusEl.style.color = '#d9534f';
                statusEl.innerText = '狀態：❌ 連線失敗或已取消選擇';
            }
        }

        async function sendCmd(cmd) {
            if (bleCharacteristic) {
                try {
                    let encoder = new TextEncoder();
                    await bleCharacteristic.writeValue(encoder.encode(cmd));
                } catch (err) {
                    console.log('發送失敗:', err);
                    alert('藍牙連線中斷，請重新整理網頁！');
                }
            }
        }
    </script>
</body>
</html>

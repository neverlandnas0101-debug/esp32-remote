<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇幻島 藍芽智能機器人</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { text-align: center; font-family: -apple-system, sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; }
        
        .title-container { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 10px 0; }
        .title-container img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 3px solid #007bff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; margin: 0; font-size: 22px; }
        
        .bt-card { background: white; max-width: 480px; margin: 5px auto 15px auto; padding: 12px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #connectBtn { font-size: 17px; padding: 10px 24px; background-color: #007bff; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 3px 6px rgba(0,123,255,0.25); }
        #connectBtn:active { background-color: #0056b3; }
        #disconnectBtn { font-size: 14px; padding: 6px 16px; background-color: #6c757d; color: white; border: none; border-radius: 15px; cursor: pointer; display: none; margin-top: 5px; }
        #disconnectBtn:active { background-color: #5a6268; }
        #status { font-size: 13px; color: #d9534f; font-weight: bold; }

        #controls { display: none; margin-top: 10px; width: 100%; max-width: 480px; margin-left: auto; margin-right: auto; }
        .group-title { font-size: 15px; font-weight: bold; color: #555; margin-bottom: 8px; display: block; }

        .speed-container { background: white; border-radius: 12px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .speed-btn-group { display: flex; justify-content: center; gap: 15px; }
        .speed-btn { flex: 1; font-size: 18px; font-weight: bold; padding: 12px; background-color: #e9ecef; color: #495057; border: 2px solid #ced4da; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .speed-btn.active { background-color: #007bff; color: white; border-color: #0056b3; box-shadow: 0 3px 6px rgba(0,123,255,0.3); transform: scale(1.05); }

        /* 雷達圖專屬樣式 */
        .radar-container { background: #051a05; border-radius: 12px; padding: 15px 10px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); color: #00ff00; }
        .radar-container .group-title { color: #00ff00; }
        #radarCanvas { background-color: transparent; display: block; margin: 0 auto; filter: drop-shadow(0 0 5px rgba(0,255,0,0.3)); }
        #radarDist { margin-top: 10px; font-size: 14px; font-weight: bold; letter-spacing: 1px; min-height: 20px; transition: color 0.3s;}

        .mode-container { margin-bottom: 15px; width: 100%; }
        .btn-auto { font-size: 18px; font-weight: bold; padding: 12px; width: 100%; background-color: #ffc107; color: #333; border: 2px solid #e0a800; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.08); transition: all 0.1s ease; }
        .btn-auto.active { background-color: #28a745; color: white; border-color: #1e7e34; }
        .btn-auto:active { transform: scale(0.97); }

        /* --- 新增：語音遙控專屬樣式 --- */
        .voice-container { background: white; border-radius: 12px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .btn-mic { font-size: 18px; font-weight: bold; padding: 12px; width: 100%; background-color: #e91e63; color: white; border: 2px solid #c2185b; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 8px rgba(233,30,99,0.25); transition: all 0.2s ease; }
        .btn-mic.recording { animation: pulse 1.2s infinite; background-color: #ff1744; border-color: #d50000; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); box-shadow: 0 4px 15px rgba(255,23,68,0.6); } 100% { transform: scale(1); } }
        #voiceResult { margin-top: 8px; font-size: 14px; font-weight: bold; color: #007bff; min-height: 20px; }

        .joystick-container { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; }
        .stick-group { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .stick-row { display: flex; gap: 10px; }
        .d-btn { font-size: 32px; background-color: #ffffff; border: 2px solid #b8c2cc; border-radius: 18px; cursor: pointer; width: 72px; height: 72px; box-shadow: 0 4px 8px rgba(0,0,0,0.08); display: flex; justify-content: center; align-items: center; transition: transform 0.08s ease, background-color 0.08s ease; }
        .d-btn:active { background-color: #d1e7dd; border-color: #198754; transform: scale(0.93); }
        .btn-stop { background-color: #ff4d4d; border: 2px solid #d93838; color: white; font-size: 18px; font-weight: bold; width: 154px; height: 50px; border-radius: 15px; box-shadow: 0 4px 8px rgba(255,77,77,0.25); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.08s ease; }
        .btn-stop:active { background-color: #cc0000; transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="title-container">
        <img src="LOGO.jpg" alt="奇幻島標誌">
        <h2>奇幻島 藍牙智能機器人</h2>
    </div>

    <div class="bt-card">
        <button id="connectBtn" onclick="connect()">📶 搜尋並開啟藍牙連線</button>
        <button id="disconnectBtn" onclick="disconnectBLE()">🔌 斷開藍牙連線</button>
        <div id="status">狀態：尚未與車子建立藍牙連線</div>
    </div>

    <div id="controls">
        <div class="speed-container">
            <span class="group-title">【 行駛檔位 】</span>
            <div class="speed-btn-group">
                <button id="speed2" class="speed-btn active" onclick="setSpeed(2)">🚗 一般</button>
                <button id="speed3" class="speed-btn" onclick="setSpeed(3)">🚀 快</button>
            </div>
        </div>

        <div class="radar-container">
            <span class="group-title">【 超音波環境掃描雷達 】</span>
            <canvas id="radarCanvas" width="280" height="150"></canvas>
            <div id="radarDist">✅ 啟動掃描中...</div>
        </div>

        <div class="mode-container">
            <button id="autoBtn" class="btn-auto" onclick="toggleAutoMode()">🤖 切換自動避障 (關閉)</button>
        </div>

        <!-- --- 新增：語音遙控區塊 --- -->
        <div class="voice-container">
            <span class="group-title">【 語音遙控 】</span>
            <button id="btnMic" class="btn-mic" onclick="toggleVoice()">🎤 點擊開始語音控制</button>
            <div id="voiceResult">等待指令...</div>
        </div>

        <div class="joystick-container">
            <div class="stick-group">
                <span class="group-title">【 前後 】</span>
                <button class="d-btn" onpointerdown="sendCmd('F')" onpointerup="sendCmd('S')" onpointerleave="sendCmd('S')">⬆️</button>
                <button class="d-btn" onpointerdown="sendCmd('B')" onpointerup="sendCmd('S')" onpointerleave="sendCmd('S')">⬇️</button>
            </div>
            <div class="stick-group">
                <span class="group-title">【 轉向 / 停止 】</span>
                <button class="btn-stop" onclick="sendCmd('S')">🛑 緊急煞車</button>
                <div class="stick-row">
                    <button class="d-btn" onpointerdown="sendCmd('L')" onpointerup="sendCmd('S')" onpointerleave="sendCmd('S')">⬅️</button>
                    <button class="d-btn" onpointerdown="sendCmd('R')" onpointerup="sendCmd('S')" onpointerleave="sendCmd('S')">➡</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let bluetoothDevice;
        let bleWriteCharacteristic; 
        let bleNotifyCharacteristic; 
        let isAutoMode = false;
        let currentSpeed = 2; 
        let receiveBuffer = ""; 

        // ==========================================
        // 真實雷達動畫引擎 (保留殘影與掃描動畫)
        // ==========================================
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const radarRadius = 130;
        const centerX = canvas.width / 2;
        const centerY = canvas.height - 10;
        
        let targetAngle = 90;       
        let displayAngle = 0;       
        let scanDirection = 1;      
        let obstacleMemory = {};    

        function renderRadarLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radarRadius, Math.PI, 0);
            ctx.fillStyle = 'rgba(0, 30, 0, 0.8)';
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(0, 180, 0, 0.5)';
            ctx.lineWidth = 1;
            for(let i=1; i<=3; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radarRadius * (i/3), Math.PI, 0);
                ctx.stroke();
            }
            [0, 30, 90, 150, 180].forEach(deg => {
                let rad = (180 - deg) * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + Math.cos(rad) * radarRadius, centerY - Math.sin(rad) * radarRadius);
                ctx.stroke();
            });

            displayAngle += scanDirection * 1.5; 
            if (displayAngle >= 180) { displayAngle = 180; scanDirection = -1; }
            if (displayAngle <= 0) { displayAngle = 0; scanDirection = 1; }
            
            let currentRad = (180 - displayAngle) * Math.PI / 180;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radarRadius, currentRad, currentRad + (scanDirection * 0.35), scanDirection === -1);
            ctx.lineTo(centerX, centerY);
            ctx.fillStyle = 'rgba(0, 255, 0, 0.25)';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + Math.cos(currentRad) * radarRadius, centerY - Math.sin(currentRad) * radarRadius);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.stroke();

            let now = Date.now();
            let activeWarnings = [];

            for (let ang in obstacleMemory) {
                let b = obstacleMemory[ang];
                let age = now - b.time;
                
                if (age < 2500) {
                    let opacity = 1.0 - (age / 2500); 
                    
                    let r = (180 - parseInt(ang)) * Math.PI / 180; 
                    let distRatio = Math.min(b.dist / 100, 1); 
                    const pointX = centerX + Math.cos(r) * radarRadius * distRatio;
                    const pointY = centerY - Math.sin(r) * radarRadius * distRatio;
                    
                    ctx.beginPath();
                    ctx.arc(pointX, pointY, 6, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(255, ${parseInt(ang) === 90 ? 0 : 100}, 0, ${opacity})`;
                    ctx.fill();
                    
                    let dirStr = parseInt(ang) === 90 ? "前方" : (parseInt(ang) === 150 ? "左方" : "右方");
                    activeWarnings.push(`${dirStr}${b.dist}cm`);
                }
            }

            const distEl = document.getElementById('radarDist');
            if (activeWarnings.length > 0) {
                distEl.innerText = "⚠️ 障礙: " + activeWarnings.join(" | ");
                distEl.style.color = '#ff4d4d';
            } else {
                distEl.innerText = "✅ 周圍安全 (掃描中...)";
                distEl.style.color = '#00ff00';
            }

            requestAnimationFrame(renderRadarLoop);
        }
        
        renderRadarLoop();

        // ==========================================
        // 藍牙通訊邏輯
        // ==========================================
        function setSpeed(level) {
            currentSpeed = level;
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('speed' + level).classList.add('active');
            sendCmd('V' + level); // 發送 V2 (一般) 或 V3 (快)
        }

        async function connect() {
            try {
                if (!navigator.bluetooth) { alert('請使用 Bluefy App 或是支援藍牙的瀏覽器！'); return; }
                const statusEl = document.getElementById('status');
                statusEl.style.color = '#f0ad4e'; statusEl.innerText = '狀態：正在掃描附近的藍牙車...';
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                
                bleWriteCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                try {
                    bleNotifyCharacteristic = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
                    await bleNotifyCharacteristic.startNotifications();
                    bleNotifyCharacteristic.addEventListener('characteristicvaluechanged', handleReceiveData);
                } catch(e) { console.log("沒有雷達資料"); }
                
                statusEl.style.color = '#198754'; statusEl.innerText = '狀態：🟢 藍牙已連線，可以開始遙控！';
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'block';
                document.getElementById('controls').style.display = 'block';
                setSpeed(currentSpeed); // 連線後同步目前的檔位
            } catch (error) { document.getElementById('status').innerText = '狀態：❌ 連線失敗或已取消'; }
        }

        function handleReceiveData(event) {
            let value = new TextDecoder().decode(event.target.value);
            receiveBuffer += value;
            
            let lines = receiveBuffer.split('\n');
            for(let i=0; i < lines.length - 1; i++) {
                let line = lines[i].trim();
                if(line.startsWith("R:")) {
                    let data = line.substring(2).split(",");
                    if(data.length === 2) {
                        let ang = parseInt(data[0]);
                        let dist = parseInt(data[1]);
                        
                        targetAngle = ang; 
                        if (dist < 100 && dist > 0) {
                            obstacleMemory[ang] = { dist: dist, time: Date.now() };
                        }
                    }
                }
            }
            receiveBuffer = lines[lines.length - 1]; 
        }

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            const autoBtn = document.getElementById('autoBtn');
            if (isAutoMode) {
                autoBtn.classList.add('active'); autoBtn.innerText = '🤖 自動避障中 (點擊關閉)'; sendCmd('A');
            } else {
                autoBtn.classList.remove('active'); autoBtn.innerText = '🤖 切換自動避障 (關閉)'; sendCmd('S');
            }
        }

        function disconnectBLE() { if (bluetoothDevice) bluetoothDevice.gatt.disconnect(); onDisconnected(); }
        
        function onDisconnected() {
            bleWriteCharacteristic = null; bleNotifyCharacteristic = null; isAutoMode = false;
            document.getElementById('autoBtn').classList.remove('active');
            document.getElementById('autoBtn').innerText = '🤖 切換自動避障 (關閉)';
            document.getElementById('status').innerText = '狀態：🔌 藍牙已斷開連線';
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('disconnectBtn').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            stopVoice(); // 斷線時自動關閉語音辨識
        }
        
        async function sendCmd(cmd) { if (bleWriteCharacteristic) await bleWriteCharacteristic.writeValue(new TextEncoder().encode(cmd)); }

        // ==========================================
        // 新增：Web Speech API 語音控制模組
        // ==========================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = true; // 保持持續聆聽
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const text = event.results[event.results.length - 1][0].transcript.trim();
                document.getElementById('voiceResult').innerText = "辨識結果：" + text;

                // 根據語音字串判斷並發送對應藍牙指令 (您可以自行增減關鍵字)
                if (text.includes("前進") || text.includes("往前") || text.includes("走")) sendCmd('F');
                else if (text.includes("後退") || text.includes("倒車")) sendCmd('B');
                else if (text.includes("左轉")) sendCmd('L');
                else if (text.includes("右轉")) sendCmd('R');
                else if (text.includes("停") || text.includes("煞車")) sendCmd('S');
                else if (text.includes("避障") || text.includes("自動")) toggleAutoMode();
            };

            recognition.onerror = (e) => {
                console.error("語音辨識錯誤", e);
                document.getElementById('voiceResult').innerText = "⚠️ 語音辨識錯誤或超時";
                stopVoice();
            };
        }

        function toggleVoice() {
            if (!isListening) startVoice();
            else stopVoice();
        }

        function startVoice() {
            if (!recognition) {
                alert("抱歉！您的瀏覽器不支援語音辨識，請使用 Android 的 Google Chrome。");
                return;
            }
            try {
                recognition.start();
                isListening = true;
                const btn = document.getElementById('btnMic');
                btn.classList.add('recording');
                btn.innerText = "🎙️ 聆聽中... (說「前進/後退」)";
                document.getElementById('voiceResult').innerText = "請說出指令...";
            } catch(e) {
                console.log("語音啟動錯誤", e);
            }
        }

        function stopVoice() {
            if (recognition && isListening) {
                recognition.stop();
            }
            isListening = false;
            const btn = document.getElementById('btnMic');
            btn.classList.remove('recording');
            btn.innerText = "🎤 點擊開始語音控制";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEAM 藍牙遙控車</title>
    <style>
        body { 
            text-align: center; 
            font-family: sans-serif; 
            background-color: #f0f2f5; 
            margin: 0;
            padding: 10px;
        }
        h2 { color: #333; margin: 10px 0; font-size: 20px; }
        
        /* 藍牙模式狀態列卡片 */
        .bt-card {
            background: white;
            max-width: 500px;
            margin: 10px auto;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #connectBtn { 
            font-size: 18px; 
            padding: 12px 25px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #connectBtn:active { background-color: #0056b3; }

        #status { font-size: 14px; color: #d9534f; font-weight: bold; }

        /* 雙手搖桿介面 */
        #controls { 
            display: none; 
            margin-top: 15px; 
        }
        .joystick-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .stick-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .stick-row {
            display: flex;
            gap: 15px;
        }
        /* 超大按鈕設計 */
        .d-btn {
            font-size: 32px;
            background-color: #fff;
            border: 3px solid #ccc;
            border-radius: 20px;
            cursor: pointer;
            width: 100px;
            height: 100px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.1);
            transition: all 0.1s ease;
        }
        .d-btn:active {
            background-color: #d1e7dd;
            border-color: #198754;
            transform: scale(0.95);
        }
        .btn-stop {
            background-color: #ff4d4d;
            color: white;
            border: none;
            font-size: 20px;
            font-weight: bold;
            width: 100px;
            height: 100px;
            border-radius: 20px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .btn-stop:active { background-color: #cc0000; transform: scale(0.95); }
    </style>
</head>
<body>
    <h2>🚗 STEAM 智慧遙控車</h2>

    <!-- 藍牙連接模式控制列 -->
    <div class="bt-card">
        <div style="font-size: 15px; color: #444; font-weight: bold;">藍牙通訊控制模式</div>
        <button id="connectBtn" onclick="connect()">📶 搜尋並開啟藍牙連線</button>
        <div id="status">狀態：尚未與車子建立藍牙連線</div>
    </div>

    <!-- 雙手搖桿介面：左邊前後，右邊左右與停止 -->
    <div id="controls">
        <div class="joystick-container">
            <!-- 左側搖桿：前後 -->
            <div class="stick-group">
                <span style="font-weight:bold; color:#555;">【 前後移動 】</span>
                <button class="d-btn" onclick="sendCmd('F')">⬆️</button>
                <button class="d-btn" onclick="sendCmd('B')">⬇️</button>
            </div>

            <!-- 右側搖桿：左右與停止 -->
            <div class="stick-group">
                <span style="font-weight:bold; color:#555;">【 轉向與急停 】</span>
                <div class="stick-row">
                    <button class="d-btn" onclick="sendCmd('L')">⬅️</button>
                    <button class="btn-stop" onclick="sendCmd('S')">停止</button>
                    <button class="d-btn" onclick="sendCmd('R')">➡️</button>
                </div>
                <div style="font-size: 12px; color: #888;">(左右轉向)</div>
            </div>
        </div>
    </div>

    <script>
        let bleCharacteristic;

        async function connect() {
            try {
                // 檢查瀏覽器是否支援藍牙
                if (!navigator.bluetooth) {
                    alert('您的瀏覽器不支援 Web Bluetooth，請改用 Bluefy 或 Chrome！');
                    return;
                }

                document.getElementById('status').style.color = '#f0ad4e';
                document.getElementById('status').innerText = '狀態：正在掃描附近的藍牙車...';
                
                // 叫出藍牙裝置選擇視窗
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });

                document.getElementById('status').innerText = '狀態：正在建立藍牙通道 (GATT)...';
                const server = await device.gatt.connect();
                
                document.getElementById('status').innerText = '狀態：正在配置序列埠服務...';
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                bleCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                
                // 連線成功，切換介面
                document.getElementById('status.style.color'] = '#198754';
                document.getElementById('status').innerText = '狀態：🟢 藍牙已連線，可以開始遙控！';
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
            } catch (error) {
                console.log(error);
                document.getElementById('status').style.color = '#d9534f';
                document.getElementById('status').innerText = '狀態：❌ 連線失敗或您取消了藍牙選擇';
            }
        }

        async function sendCmd(cmd) {
            if (bleCharacteristic) {
                try {
                    let encoder = new TextEncoder();
                    await bleCharacteristic.writeValue(encoder.encode(cmd));
                } catch (err) {
                    console.log('發送失敗:', err);
                    alert('藍牙連線可能已中斷，請重新整理網頁！');
                }
            }
        }
    </script>
</body>
</html>

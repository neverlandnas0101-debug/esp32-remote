<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>STEAM 藍牙遙控車</title>
    <style>
        body { 
            text-align: center; 
            font-family: sans-serif; 
            background-color: #f0f2f5; 
            padding-top: 30px; 
        }
        h2 { color: #333; }
        
        #connectBtn { 
            font-size: 20px; 
            padding: 15px 30px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #connectBtn:active { background-color: #0056b3; }

        #status { font-size: 16px; color: #666; margin: 15px 0; }

        #controls { 
            display: none; 
            margin-top: 30px; 
        }
        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 12px;
            justify-content: center;
            align-items: center;
        }
        .d-btn {
            font-size: 28px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 15px;
            cursor: pointer;
            width: 90px;
            height: 90px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.1s ease;
        }
        .d-btn:active {
            background-color: #e2e6ea;
            transform: scale(0.95);
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-stop { grid-column: 2; grid-row: 2; background-color: #ff4d4d; color: white; border: none; font-size: 20px; font-weight: bold;}
        .btn-stop:active { background-color: #cc0000; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <h2>🚗 STEAM 智慧遙控車</h2>
    <button id="connectBtn" onclick="connect()">點擊連線藍牙車</button>
    <div id="status">尚未連線</div>

    <div id="controls">
        <div class="control-grid">
            <button class="d-btn btn-up" onclick="sendCmd('F')">⬆️</button>
            <button class="d-btn btn-left" onclick="sendCmd('L')">⬅️</button>
            <button class="d-btn btn-stop" onclick="sendCmd('S')">停止</button>
            <button class="d-btn btn-right" onclick="sendCmd('R')">➡️</button>
            <button class="d-btn btn-down" onclick="sendCmd('B')">⬇️</button>
        </div>
    </div>

    <script>
        let bleCharacteristic;

        async function connect() {
            try {
                document.getElementById('status').innerText = '搜尋藍牙裝置中...';
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });

                document.getElementById('status').innerText = '連線中...';
                const server = await device.gatt.connect();
                
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                bleCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                
                document.getElementById('status').innerText = '🟢 連線成功！可以開始遙控';
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
            } catch (error) {
                console.log(error);
                document.getElementById('status').innerText = '連線失敗或取消';
            }
        }

        async function sendCmd(cmd) {
            if (bleCharacteristic) {
                let encoder = new TextEncoder();
                await bleCharacteristic.writeValue(encoder.encode(cmd));
            }
        }
    </script>
</body>
</html>
